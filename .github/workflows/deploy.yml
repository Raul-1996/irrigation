name: Deploy to Wirenboard

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type "deploy" to confirm deployment'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirmation == 'deploy'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.WB_HOST }}
          username: ${{ secrets.WB_USER }}
          password: ${{ secrets.WB_PASSWORD }}
          proxy_host: ${{ secrets.JUMP_HOST }}
          proxy_username: ${{ secrets.JUMP_USER }}
          proxy_key: ${{ secrets.JUMP_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd /opt/wb-irrigation/irrigation
            git fetch --quiet origin main
            TARGET_COMMIT=$(git rev-parse --verify 'origin/main^{commit}')
            STAGED_UPDATER=$(mktemp /tmp/wb-irrigation-update.XXXXXX)
            trap 'rm -f "$STAGED_UPDATER"' EXIT
            git show "${TARGET_COMMIT}:update_server.sh" > "$STAGED_UPDATER"
            chmod 0700 "$STAGED_UPDATER"
            export BRANCH=main
            export TARGET_COMMIT
            bash "$STAGED_UPDATER" --yes
